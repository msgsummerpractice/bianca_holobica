<mat-toolbar color="primary" class="fixed top-0 left-0 right-0 z-50 shadow-md">
  <div class="flex items-center justify-between w-full max-w-7xl mx-auto px-2 md:px-4">
    <div class="flex items-center gap-2">
      <button
        mat-icon-button
        class="md:!hidden"
        [matMenuTriggerFor]="mobileMenu"
        aria-label="Navigation menu"
      >
        <mat-icon>menu</mat-icon>
      </button>

      <mat-icon class="hidden sm:inline-block">pets</mat-icon>
      <span class="font-bold text-lg md:text-xl tracking-wide">Dog Gallery</span>
    </div>

    <nav class="hidden md:flex items-center gap-2">
      <a mat-button routerLink="/home" routerLinkActive="bg-pink-700">Home</a>

      <a
        mat-button
        routerLink="/breeds"
        routerLinkActive="bg-pink-700"
        *ifAuth="authService.isAuthenticated()"
      >
        Breeds
      </a>

      <a mat-button routerLink="/about" routerLinkActive="bg-pink-700">About</a>
    </nav>

    <div class="flex items-center gap-1 md:gap-2">
      <button mat-icon-button aria-label="Notifications">
        <mat-icon>notifications</mat-icon>
      </button>

      <a
        mat-button
        routerLink="/login"
        routerLinkActive="bg-pink-700"
        class="!hidden md:!inline-flex"
        *ifAuth="!authService.isAuthenticated()"
      >
        <mat-icon class="mr-1">account_circle</mat-icon>
        Sign In
      </a>

      <button
        mat-button
        (click)="authService.logout()"
        class="!hidden md:!inline-flex"
        *ifAuth="authService.isAuthenticated()"
      >
        <mat-icon class="mr-1">logout</mat-icon>
        Sign Out
      </button>
    </div>
  </div>
</mat-toolbar>

<mat-menu #mobileMenu="matMenu">
  <a mat-menu-item routerLink="/home">
    <mat-icon>home</mat-icon>
    <span>Home</span>
  </a>

  <a mat-menu-item routerLink="/breeds" *ifAuth="authService.isAuthenticated()">
    <mat-icon>pets</mat-icon>
    <span>Breeds</span>
  </a>

  <a mat-menu-item routerLink="/about">
    <mat-icon>info</mat-icon>
    <span>About</span>
  </a>

  <a mat-menu-item routerLink="/login" *ifAuth="!authService.isAuthenticated()">
    <mat-icon>account_circle</mat-icon>
    <span>Sign In</span>
  </a>

  <button mat-menu-item (click)="authService.logout()" *ifAuth="authService.isAuthenticated()">
    <mat-icon>logout</mat-icon>
    <span>Sign Out</span>
  </button>
</mat-menu>

<main>
  <router-outlet />
</main>
