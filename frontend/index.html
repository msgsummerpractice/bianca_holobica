<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog gallery App</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        #dog-image { max-width: 400px; height: auto; border-radius: 8px; margin-top: 15px; display: block; margin-left: auto; margin-right: auto; }
        #loading { color: gray; font-style: italic; display: none; }
        #error { color: red; display: none; }
    </style>
</head>
<body>

    <h1>
        "Random Dog Image Generator"
    </h1>
    <button id="fetch-dog-btn">Show me a dog!</button>
    <p id="loading">Loading...</p>
    <p id="error">Failed to load dog image. Please try again.</p>
    <div>
        <img id="dog-image" src="" alt="Random Dog Image" style="display: none;">
    </div>

    <script src = "script.js"></script>
</body>
</html>
